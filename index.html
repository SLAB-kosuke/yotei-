<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>会社予定表</title>

  <link rel="manifest" href="manifest.json" />

  <style>

    body{
      margin:0;
      padding:0;
      font-family:sans-serif;
      background:#f3f4f6;
    }

    .header{
      background:#2563eb;
      color:white;
      padding:15px;
      text-align:center;
      font-size:22px;
      font-weight:bold;
    }

    .month-bar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:10px;
      background:white;
    }

    .month-btn{
      background:#2563eb;
      color:white;
      border:none;
      padding:8px 14px;
      border-radius:8px;
      font-size:16px;
      cursor:pointer;
    }

    .month-title{
      font-size:22px;
      font-weight:bold;
    }

    .calendar{
      display:grid;
      grid-template-columns:repeat(7,1fr);
      gap:2px;
      padding:2px;
      background:#d1d5db;
    }

    .day-name{
      background:#1e3a8a;
      color:white;
      text-align:center;
      padding:10px 0;
      font-weight:bold;
    }

    .day{
      background:white;
      min-height:120px;
      padding:4px;
      position:relative;
      cursor:pointer;
      overflow:hidden;
    }

    .empty{
      background:#e5e7eb;
    }

    .date{
      font-weight:bold;
      margin-bottom:4px;
    }

    .event{
      font-size:11px;
      margin-bottom:4px;
      padding:3px;
      border-radius:5px;
      color:#111827;
      word-break:break-word;
    }

    .boss{
      background:#fde047;
    }

    .ide{
      background:#7dd3fc;
    }

    .kosuke{
      background:#f9a8d4;
    }

    .monthly-section{
      margin:10px;
      background:white;
      border-radius:10px;
      padding:10px;
    }

    .monthly-title{
      font-size:18px;
      font-weight:bold;
      margin-bottom:10px;
    }

    .list-item{
      padding:6px 0;
      border-bottom:1px solid #ddd;
      font-size:14px;
    }

    .modal{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.5);
      display:none;
      justify-content:center;
      align-items:center;
      z-index:1000;
    }

    .modal-content{
      background:white;
      width:90%;
      max-width:500px;
      border-radius:12px;
      padding:20px;
      max-height:90vh;
      overflow:auto;
    }

    .modal-title{
      font-size:20px;
      font-weight:bold;
      margin-bottom:10px;
    }

    select,
    input{
      width:100%;
      margin-bottom:10px;
      padding:10px;
      font-size:16px;
      border:1px solid #ccc;
      border-radius:8px;
      box-sizing:border-box;
    }

    .time-row{
      display:flex;
      gap:10px;
    }

    .save-btn{
      width:100%;
      background:#2563eb;
      color:white;
      border:none;
      padding:12px;
      border-radius:8px;
      font-size:16px;
      cursor:pointer;
      margin-bottom:10px;
    }

    .close-btn{
      width:100%;
      background:#6b7280;
      color:white;
      border:none;
      padding:12px;
      border-radius:8px;
      font-size:16px;
      cursor:pointer;
    }

    .modal-event-item{
      padding:10px 0;
      border-bottom:1px solid #ddd;
    }

    .button-group{
      margin-top:8px;
      display:flex;
      gap:6px;
      flex-wrap:wrap;
    }

    .delete-btn{
      background:#dc2626;
      color:white;
      border:none;
      padding:6px 10px;
      border-radius:6px;
      cursor:pointer;
    }

    .repeat-delete-btn{
      background:#f59e0b;
      color:white;
      border:none;
      padding:6px 10px;
      border-radius:6px;
      cursor:pointer;
    }

    .login-screen{
      position:fixed;
      inset:0;
      background:white;
      z-index:9999;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .login-box{
      width:300px;
      background:#f9fafb;
      padding:20px;
      border-radius:12px;
      box-shadow:0 0 10px rgba(0,0,0,0.2);
      text-align:center;
    }

    .login-btn{
      width:100%;
      background:#2563eb;
      color:white;
      border:none;
      padding:12px;
      border-radius:8px;
      font-size:16px;
      cursor:pointer;
    }

  </style>
</head>

<body>

  <div id="loginScreen" class="login-screen">

    <div class="login-box">

      <h2>会社予定表</h2>

      <input
        type="password"
        id="passwordInput"
        placeholder="パスワード"
      />

      <button
        class="login-btn"
        onclick="login()"
      >
        ログイン
      </button>

    </div>

  </div>

  <div class="header">
    会社予定表
  </div>

  <div class="month-bar">

    <button
      class="month-btn"
      onclick="changeMonth(-1)"
    >
      ←
    </button>

    <div
      class="month-title"
      id="monthYear"
    >
    </div>

    <button
      class="month-btn"
      onclick="changeMonth(1)"
    >
      →
    </button>

  </div>

  <div
    class="calendar"
    id="calendar"
  >
  </div>

  <div class="monthly-section">

    <div class="monthly-title">
      当月予定一覧
    </div>

    <div id="monthlyList"></div>

  </div>

  <div
    class="modal"
    id="modal"
  >

    <div class="modal-content">

      <div
        class="modal-title"
        id="selectedDate"
      >
      </div>

      <select id="name">

        <option value="">
          名前選択
        </option>

        <option value="社長">
          社長
        </option>

        <option value="井手">
          井手
        </option>

        <option value="小助川">
          小助川
        </option>

      </select>

      <input
        type="text"
        id="schedule"
        placeholder="予定入力"
      />

      <div class="time-row">

        <select id="hour"></select>

        <select id="minute">

          <option value="00">00</option>
          <option value="15">15</option>
          <option value="30">30</option>
          <option value="45">45</option>

        </select>

      </div>

      <select id="repeatType">

        <option value="none">
          繰り返しなし
        </option>

        <option value="daily">
          毎日
        </option>

        <option value="weekly">
          毎週
        </option>

        <option value="monthly">
          毎月
        </option>

      </select>

      <button
        class="save-btn"
        onclick="saveEvent()"
      >
        決定
      </button>

      <div id="dayEvents"></div>

      <button
        class="close-btn"
        onclick="closeModal()"
      >
        閉じる
      </button>

    </div>

  </div>

  <script
    type="module"
    src="script.js"
  ></script>

</body>
</html>
